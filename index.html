<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Briceno Tennis</title>
<meta name="color-scheme" content="dark">
<style>
/* ===== Briceno Tennis · BRICEÑO Digital Jewelry (mesmo sistema do Briceno Life, ver fonte/DESIGN.md) =====
   A · Signature Jewelry (.hc): só os cartões principais (foco da semana, semana, bola atual e próxima, próximo torneio).
   B · Precision Glass (.dj-glass): painéis protagonistas (referências, notas, guia).
   C · Quiet Luxury (.list, .dj-quiet): listas, formulários e informação secundária.
   Escuro, como o Briceno Life. O modo claro fica preparado nos tokens (data-theme="light"), não ativado. */
:root{
  --bg:#0A0908; --bg2:#0F0D0C; --surface:#171513; --surface2:#1F1B18; --raise:#221E1B;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --text:#F4EEE8; --ink-2:#CDC3B9; --muted:#968B81; --faint:#7A7067;
  --clay:#E08C4E; --clay-2:#C46F35; --clay-ink:#1C0E05; --clay-soft:#2F1E12;
  --gold:#B9937A; --scrim:rgba(0,0,0,.62);
  --b-red:#E8624E; --b-orange:#F29A4C; --b-green:#8FC45A; --b-yellow:#D8DE52;
  --ok:#86C27A; --danger:#E5736A;
  --dj-signal:#EEA36A; --dj-signal-line:#E39A60;
  --dj-hairline:rgba(150,136,124,.40); --dj-hairline-core:rgba(172,142,116,.58); --dj-hairline-seg:rgba(222,156,108,.96);
  --dj-glass-base:linear-gradient(168deg,#1C1916 0%,#151311 60%,#131110 100%);
  --dj-quiet:#171513; --dj-quiet-line:rgba(255,255,255,.06); --dj-quiet-rule:rgba(255,255,255,.065);
  --dj-tile:linear-gradient(155deg,#221E1B,#191614); --dj-tile-line:rgba(255,255,255,.07);
  --dj-r-panel:20px; --hm-r:20px; --hm-pad:14px; --hm-pt:12px; --hm-pb:12px; --hm-col:12px; --hm-row:12px;
  --hm-copper-hi:#F7A665; --hm-copper:#D97B3C; --hm-copper-lo:#A4501F; --hm-date:#C3AD99;
  --r-sm:12px; --r-pill:999px;
  --t-cap:.765rem; --t-sm:.824rem; --t-body:.941rem; --t-lg:1.059rem; --t-sec:1.118rem; --t-xl:1.3rem; --t-num:1.529rem; --t-page:1.765rem;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --tabbar:49px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{ /* preparado, não ativado (como no Briceno Life) */
  --bg:#F6F2ED; --bg2:#EFE9E2; --surface:#FFFFFF; --surface2:#F5F0EA; --line:rgba(52,32,14,.10); --line2:rgba(52,32,14,.18);
  --text:#1C1714; --muted:#685C52; --faint:#8C8076; color-scheme:light;
}
html{font-size:17px;-webkit-text-size-adjust:100%;background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--t-body);line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--dj-signal)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--dj-signal);outline-offset:2px;border-radius:8px}
@keyframes in{from{opacity:0}to{opacity:1}}
.app > *{animation:in .22s ease both}
@media (prefers-reduced-motion: reduce){.app > *{animation:none}}

/* ---------- abertura ---------- */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .5s ease}
#boot.out{opacity:0;pointer-events:none}
#boot.inst{transition:none}
#boot .bt-mark img,.welcome .mk img{display:block;width:100%;height:100%}
#boot .bt-mark{width:104px;height:104px;border-radius:23px;overflow:hidden;box-shadow:0 0 0 1px rgba(236,160,98,.25),0 22px 60px -10px rgba(214,122,56,.35),0 18px 50px rgba(0,0,0,.6);animation:bt-in .8s cubic-bezier(.2,.8,.2,1) both}
#boot .bt-name{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;animation:bt-in .8s .1s cubic-bezier(.2,.8,.2,1) both}
#boot .bt-name span{color:var(--dj-signal);font-weight:600}
#boot .bt-ctl{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:96px}
#boot:not(.lock) .bt-ctl{visibility:hidden}
#boot.busy .bt-ctl{opacity:.5;pointer-events:none}
@keyframes bt-in{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#boot .bt-mark,#boot .bt-name{animation:none}}
.bt-face{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:var(--r-pill);font-weight:650;color:#140903;
  background:linear-gradient(180deg,var(--hm-copper-hi),var(--hm-copper) 48%,var(--hm-copper-lo));box-shadow:inset 0 1px 0 rgba(255,236,214,.45)}
.bt-face svg{width:22px;height:22px}
.bt-rec{color:var(--muted);font-size:var(--t-sm);padding:8px}
.bt-msg{color:var(--danger);min-height:1.2em;margin:0;font-size:var(--t-sm)}
.bt-form{display:flex;gap:8px}

/* ---------- estrutura ---------- */
.app{max-width:600px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 8px) 16px calc(var(--tabbar) + var(--sab) + 36px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:4px 0}
.who{display:flex;align-items:center;gap:10px;min-height:46px;padding:5px 14px 5px 5px;border-radius:var(--r-pill);max-width:100%;border:1px solid transparent;
  background:linear-gradient(160deg,#241710,#120C08 70%) padding-box,linear-gradient(135deg,rgba(236,160,98,.75),rgba(150,84,40,.35) 45%,rgba(196,118,62,.6)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,214,170,.08),0 0 14px -6px rgba(214,122,56,.45)}
.who .av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:var(--t-sm);color:#F3A564;border:1px solid transparent;
  background:radial-gradient(circle at 35% 28%,#4A230A,#2A1203 72%) padding-box,linear-gradient(150deg,#F2A766,#8E4A1C 60%,#C7783D) border-box}
.who .nm{font-weight:640;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who svg{width:16px;height:16px;color:rgba(255,255,255,.62);flex:0 0 16px}
.page-h{font-size:1.882rem;font-weight:720;letter-spacing:-.03em;line-height:1.08;margin:10px 2px 4px;text-wrap:balance}
.page-sub{color:var(--hm-date);font-weight:520;font-size:var(--t-sm);margin:0 2px 20px;line-height:1.4}
.sec-t{display:flex;align-items:center;gap:12px;margin:26px 2px 10px;font-size:var(--t-cap);font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);line-height:1.3}
.sec-t::after{content:"";flex:1;min-width:24px;height:1px;background:linear-gradient(90deg,rgba(185,147,122,.4),rgba(185,147,122,0))}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:var(--t-sm)} .cap{font-size:var(--t-cap)}
p{margin:0 0 8px}
b,strong{font-weight:650}

/* Signature divider: fio de 1 px físico com segmento cobre central */
.dj-divider{position:relative;height:1px;margin:22px 0;background:linear-gradient(90deg,rgba(150,136,124,0),var(--dj-hairline) 22%,var(--dj-hairline-core) 50%,var(--dj-hairline) 78%,rgba(150,136,124,0))}
.dj-divider::after{content:"";position:absolute;left:50%;top:0;width:32px;height:100%;margin-left:-16px;background:linear-gradient(90deg,rgba(214,150,104,0),var(--dj-hairline-seg) 50%,rgba(214,150,104,0))}
@media (min-resolution:2dppx){.dj-divider{transform:scaleY(.5)}}
@media (min-resolution:3dppx){.dj-divider{transform:scaleY(.3334)}}

/* ---------- A · cartões-joia (mesma construção da Home do Briceno Life, v35) ---------- */
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--hm-row) var(--hm-col)}
.hgrid + .hgrid,.hc + .hgrid,.hgrid + .hc{margin-top:var(--hm-row)}
.hc{--g:#EE8644;--gd:#1F0B02;--gt:#8F421B;--gb:#A04B21;--gr:#DE7E43;--gh:#FFD9A8;
  position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;min-width:0;width:100%;height:var(--hc-h,7.5rem);text-align:left;color:#fff;
  padding:var(--hm-pt) var(--hm-pad) var(--hm-pb);border-radius:var(--hm-r);border:1px solid transparent;
  background:
    radial-gradient(50% 62% at 100% 52%,color-mix(in srgb,var(--g) 24%,transparent),transparent 72%) padding-box,
    radial-gradient(92% 82% at 100% 100%,var(--gb),transparent 64%) padding-box,
    radial-gradient(100% 105% at 0% 0%,var(--gt),transparent 60%) padding-box,
    linear-gradient(160deg,color-mix(in srgb,var(--gt) 30%,var(--gd)),var(--gd) 46%,var(--gd)) padding-box,
    linear-gradient(140deg,var(--gh) 0%,var(--gr) 16%,color-mix(in srgb,var(--gr) 62%,transparent) 42%,color-mix(in srgb,var(--gr) 66%,transparent) 60%,var(--gr) 84%,var(--gh) 100%) border-box;
  box-shadow:inset 0 0 10px -4px color-mix(in srgb,var(--g) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.10),0 14px 26px -18px color-mix(in srgb,var(--g) 45%,#000);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),filter .16s ease}
.hc:active{transform:scale(.98);filter:brightness(1.08)}
.hc:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.hc-fx{position:absolute;inset:0;z-index:-1;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent 60%),linear-gradient(to right,rgba(0,0,0,.2) 40%,rgba(0,0,0,.55) 70%,#000 90%);
  mask-image:linear-gradient(to bottom,#000 40%,transparent 60%),linear-gradient(to right,rgba(0,0,0,.2) 40%,rgba(0,0,0,.55) 70%,#000 90%)}
.hc-fx svg{display:block;width:100%;height:100%}
.hc.wide .hc-fx{-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 62%),linear-gradient(to right,rgba(0,0,0,.08) 45%,rgba(0,0,0,.5) 75%,#000 95%);
  mask-image:linear-gradient(to bottom,#000 30%,transparent 62%),linear-gradient(to right,rgba(0,0,0,.08) 45%,rgba(0,0,0,.5) 75%,#000 95%)}
.hc-h{display:flex;align-items:center;gap:12px;min-width:0}
.hc-i{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:9px;color:color-mix(in srgb,var(--g) 92%,#fff);border:1px solid transparent;
  background:radial-gradient(120% 80% at 30% 0%,color-mix(in srgb,var(--g) 30%,transparent),transparent 70%) padding-box,linear-gradient(160deg,color-mix(in srgb,var(--g) 22%,var(--gd)),color-mix(in srgb,var(--g) 8%,var(--gd))) padding-box,
    linear-gradient(150deg,var(--gh),color-mix(in srgb,var(--gr) 60%,transparent) 50%,color-mix(in srgb,var(--gr) 85%,transparent)) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 6px -2px color-mix(in srgb,var(--g) 50%,transparent),0 2px 6px -2px rgba(0,0,0,.7)}
.hc-i svg{width:19px;height:19px}
.hc-i .ball{width:14px;height:14px}
.hc-i .mth.sm{width:100%;height:100%;border-radius:8px;border:0}
.hc-i:has(.mth){padding:0;overflow:hidden}
.hc-t{flex:1;min-width:0;font-size:var(--t-sm);font-weight:640;letter-spacing:-.012em;color:#fff;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-r{flex:none;font-size:var(--t-cap);font-weight:500;color:rgba(255,255,255,.72)}
.hc-v{display:block;margin-top:auto;padding-top:10px;min-width:0}
.hc-v b{font-size:var(--t-num);font-weight:700;letter-spacing:-.02em;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}
.hc-v b.txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--t-sec);font-weight:680;letter-spacing:-.015em;line-height:1.25;overflow-wrap:anywhere}
.hc-v b.word{font-size:1.294rem;letter-spacing:-.015em}
.hc-v small{font-size:var(--t-sm);font-weight:500;color:rgba(255,255,255,.74)}
.hc-s{display:block;margin-top:4px;font-size:var(--t-cap);font-weight:450;letter-spacing:-.01em;color:rgba(255,255,255,.86);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qgrid .hc-s{white-space:normal}
.hc-v,.hc-s{text-shadow:0 0 2px var(--gd),0 0 7px color-mix(in srgb,var(--gd) 80%,transparent)}
.hc.wide{min-height:0}
.qgrid .hc{height:auto;min-height:104px}
.hgrid > .hc.wide{grid-column:1 / -1}
.hc.wide .hc-v{padding-top:12px}
/* materiais do tênis (mesma construção da Home v35 do Briceno Life; cada cor vem de uma quadra ou de um objeto do jogo, ver fonte/DESIGN.md)
   saibro: terracota das quadras de saibro · bola: amarelo da bola oficial · noite: azul das quadras duras nas sessões noturnas
   celeste: azul-claro da quadra dura de verão · grama: verde da grama com o roxo da tradição */
.hc.ambar,.sw.ambar{--g:#E8A25B;--gd:#251608;--gt:#B87D42;--gb:#A86F3A;--gr:#C38A51;--gh:#FFE7B4}
.hc.saibro,.sw.saibro{--g:#E07A4C;--gd:#1E0A04;--gt:#8A3A1C;--gb:#9A4322;--gr:#C9693F;--gh:#FFC9A6}
.hc.bola,.sw.bola{--g:#D8E25C;--gd:#121404;--gt:#666D1E;--gb:#6E7522;--gr:#A6AE3E;--gh:#F4FAB0}
.hc.noite,.sw.noite{--g:#5E92DA;--gd:#030A19;--gt:#1C3762;--gb:#22447A;--gr:#4A73AE;--gh:#BCD6FF}
.hc.celeste,.sw.celeste{--g:#42B6EA;--gd:#01111B;--gt:#11556F;--gb:#15617F;--gr:#3A9CC6;--gh:#B4ECFF}
.hc.grama,.sw.grama{--g:#55B56E;--gd:#03120A;--gt:#1C4A2B;--gb:#5A2F86;--gr:#4E9A64;--gh:#D2F2D9}
/* bolas: material na cor da bola */
.hc.b-red{--g:#F07462;--gd:#2A0B07;--gt:#9C3A2C;--gb:#A63E30;--gr:#D9624F;--gh:#FFC2B6}
.hc.b-orange{--g:#F29A4C;--gd:#221004;--gt:#9A5420;--gb:#A85C24;--gr:#E08A44;--gh:#FFDDB0}
.hc.b-green{--g:#9FD25E;--gd:#0C1505;--gt:#3F5E1F;--gb:#486A24;--gr:#7FA84C;--gh:#E0F8B4}
.hc.b-yellow{--g:#DDD068;--gd:#151505;--gt:#7A712B;--gb:#766F2B;--gr:#A99B4C;--gh:#F3EA92}

.sw{width:30px;height:30px;flex:0 0 30px;border-radius:9px;margin-top:2px;background:radial-gradient(circle at 32% 28%,var(--gh),var(--g) 42%,var(--gr) 70%,var(--gd) 120%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px -4px var(--g)}
.sw-balls{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:30px;flex:0 0 30px;margin-top:2px}
.sw-balls .ball{width:13px;height:13px}
/* semana: cartão com mini-gráfico e gráfico grande da aba Treinos */
.hc.wk{height:auto;min-height:8.6rem}
.wk-b{display:flex;align-items:flex-end;gap:14px;margin-top:auto;padding-top:10px;min-width:0}
.wk-b .hc-v{flex:1;min-width:0;padding-top:0;margin-top:0}
.wk-b .hc-s{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:44%;flex:none;height:3.6rem}
.wb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wcol{position:relative;flex:1;width:100%;max-width:14px}
.wfill{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse;border-radius:4px;overflow:hidden;box-shadow:0 0 8px -2px rgba(255,255,255,.25)}
.wfill i{display:block;min-height:2px}
.wzero{position:absolute;left:15%;right:15%;bottom:0;height:2px;border-radius:2px;background:rgba(255,255,255,.22)}
.wb b{font-size:.62rem;font-weight:600;color:rgba(255,255,255,.62);line-height:1}
.wb.now b{color:#fff}
.wb.fut{opacity:.4}
.wbars.big{width:100%;height:10rem;gap:8px;margin-top:6px}
.wbars.big .wcol{max-width:30px}
.wbars.big .wb b{font-size:var(--t-cap);color:var(--muted)}
.wbars.big .wb.now b{color:var(--dj-signal)}
.wbars.big em{font-style:normal;font-size:.68rem;color:var(--ink-2);min-height:1em;line-height:1}
.wbars.big .wzero{background:rgba(255,255,255,.14)}
.wchart{padding:14px 16px 16px}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wnav b{font-weight:650}
.wnav .mv{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--dj-tile);border:1px solid var(--dj-tile-line)}
.wnav .mv svg{width:18px;height:18px}
.wnav .mv:disabled{opacity:.3}
.wleg{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:var(--t-cap);color:var(--muted)}
.wleg span{display:inline-flex;align-items:center;gap:6px}
.wleg i{width:9px;height:9px;border-radius:3px}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--dj-quiet-rule);font-size:var(--t-sm);color:var(--muted)}
.wstats b{display:block;font-size:var(--t-lg);font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
/* foto da atleta */
.av{display:grid;place-items:center;border-radius:50%;overflow:hidden;font-weight:700;color:#F3A564;border:1px solid transparent;
  background:radial-gradient(circle at 35% 28%,#4A230A,#2A1203 72%) padding-box,linear-gradient(150deg,#F2A766,#8E4A1C 60%,#C7783D) border-box}
.av img{display:block;width:100%;height:100%;object-fit:cover}
.row .ic .av{width:32px;height:32px;font-size:var(--t-sm)}
.row .ic:has(.av){padding:0;background:none;border:0;border-radius:50%}
.av.lg{width:88px;height:88px;font-size:2rem}
.pf-h{display:flex;align-items:center;gap:16px;margin-top:10px}
.pf-ph{position:relative;flex:none;border-radius:50%}
.pf-cam{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#140903;background:linear-gradient(180deg,var(--hm-copper-hi),var(--hm-copper-lo));box-shadow:0 0 0 3px var(--bg)}
.pf-cam svg{width:16px;height:16px}
/* currículo */
.cvprev img{display:block;width:100%;border-radius:10px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45);margin-bottom:12px}
/* ---------- B · Precision Glass ---------- */
.dj-glass{--tint:var(--clay);border:1px solid transparent;border-radius:var(--dj-r-panel);
  background:radial-gradient(130% 110% at 0% 0%,color-mix(in srgb,var(--tint) 10%,transparent),transparent 58%) padding-box,var(--dj-glass-base) padding-box,
    linear-gradient(165deg,color-mix(in srgb,var(--tint) 36%,rgba(255,255,255,.08)),rgba(255,255,255,.055) 32%,rgba(255,255,255,.035) 72%,color-mix(in srgb,var(--tint) 14%,rgba(255,255,255,.03))) border-box;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 32px -26px rgba(0,0,0,.9)}
.dj-glass.pad{padding:16px}
.t-saibro{--tint:#E07A4C} .t-bola{--tint:#D8E25C} .t-noite{--tint:#5E92DA} .t-celeste{--tint:#42B6EA} .t-grama{--tint:#55B56E} .t-orange{--tint:#F29A4C} .t-clay{--tint:#E08C4E}
.card{background:var(--dj-quiet);border:1px solid var(--dj-quiet-line);border-radius:var(--dj-r-panel)}
.card.pad{padding:16px}
.card + .card,.dj-glass + .dj-glass{margin-top:10px}

/* ---------- C · Quiet Luxury (listas) ---------- */
.list{background:var(--dj-quiet);border:1px solid var(--dj-quiet-line);border-radius:var(--dj-r-panel);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:13px 16px;min-height:56px;border-top:1px solid var(--dj-quiet-rule)}
.list > .row:first-child{border-top:0}
button.row:active{background:rgba(255,255,255,.03)}
.row .ic{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;background:var(--dj-tile);border:1px solid var(--dj-tile-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:var(--dj-signal)}
.row .ic svg{width:18px;height:18px}
.row .bd{flex:1;min-width:0}
.row .t1{font-weight:620;letter-spacing:-.01em;overflow-wrap:anywhere}
.row .t2{color:var(--muted);font-size:var(--t-sm);overflow-wrap:anywhere;margin-top:1px}
.row .t3{color:var(--ink-2);font-size:var(--t-sm);margin-top:4px;overflow-wrap:anywhere}
.row .rv{color:var(--dj-signal);font-size:var(--t-cap);font-weight:600;white-space:nowrap;text-align:right;padding-top:3px}
.row .chev{width:16px;height:16px;flex:0 0 16px;color:var(--faint);margin-top:3px}
.empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:var(--t-sm)}
.empty b{display:block;color:var(--text);font-size:var(--t-body);margin-bottom:4px}

/* bolas */
.ball{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bc) 55%,#fff),var(--bc) 55%,color-mix(in srgb,var(--bc) 70%,#000));vertical-align:-1px;flex:0 0 12px}
.b-red{--bc:var(--b-red)} .b-orange{--bc:var(--b-orange)} .b-green{--bc:var(--b-green)} .b-yellow{--bc:var(--b-yellow)}

/* notas e referência */
.ref{margin-top:12px;padding:13px 15px;font-size:var(--t-sm);color:var(--ink-2);line-height:1.45}
.ref b{color:#fff}
.note{padding:13px 15px;font-size:var(--t-sm);color:var(--ink-2);line-height:1.45}
.note b{color:#fff}

/* linha do tempo das bolas */
.tl{padding:4px 16px}
.tl-i{display:flex;gap:14px;position:relative;padding:12px 0}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:8px;top:34px;bottom:-6px;width:1px;background:linear-gradient(var(--line2),rgba(255,255,255,.04))}
.tl-i .ball{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.tl-i.off .ball{opacity:.25}
.tl-i .bd{flex:1;min-width:0}
.tl-i .t1{font-weight:620}
.tl-i .t2{color:var(--muted);font-size:var(--t-sm)}
.tl-i.now .t1::after{content:"atual";margin-left:8px;font-size:var(--t-cap);font-weight:650;color:var(--dj-signal);letter-spacing:.08em;text-transform:uppercase}

/* barra inferior (igual ao Briceno Life v37: 49 de conteúdo, "+" central de 48 saindo 8 acima) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.07);padding:0 max(8px,env(safe-area-inset-right,0px)) var(--sab) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;height:var(--tabbar)}
.tab{position:relative;height:var(--tabbar);min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 0 0;color:#B3A99F;font-size:13px;line-height:14px;font-weight:600}
.tab svg{width:22px;height:22px;flex:none}
.tab span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on{color:var(--dj-signal)}
.tab.on::after{content:"";position:absolute;bottom:1px;left:50%;width:34px;height:2px;margin-left:-17px;border-radius:2px;background:linear-gradient(90deg,rgba(222,140,80,0),var(--dj-signal-line),rgba(222,140,80,0))}
.tab:active{opacity:.6}
.fab{align-self:start;justify-self:center;margin-top:-8px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#140903;border:1px solid transparent;
  background:radial-gradient(90% 70% at 30% 0%,rgba(255,206,150,.55),transparent 70%) padding-box,linear-gradient(180deg,var(--hm-copper-hi),var(--hm-copper) 48%,var(--hm-copper-lo)) padding-box,
    linear-gradient(170deg,#FFD3A4,rgba(214,128,66,.6) 50%,#7A3610) border-box;
  box-shadow:inset 0 1px 0 rgba(255,236,214,.45),inset 0 -2px 4px rgba(90,36,8,.35),0 0 0 4px var(--bg),0 6px 14px -6px rgba(0,0,0,.9)}
.fab svg{width:22px;height:22px}
.fab:active{filter:brightness(.88)}
@media (max-width:359px){.tabs-in{grid-template-columns:1fr 1fr 58px 1fr 1fr}.tab{font-size:12px}}

/* folhas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:linear-gradient(180deg,#191614,#100E0D 140px);border:1px solid rgba(255,255,255,.08);border-bottom:0;border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;
  max-height:calc(100% - var(--sat) - 12px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 18px calc(var(--sab) + 22px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin:2px auto 12px}
.sheet h2{font-size:var(--t-xl);font-weight:700;letter-spacing:-.022em;margin:4px 0 6px;line-height:1.2;padding-right:40px}
.sheet h2.sec-t{font-size:var(--t-cap);font-weight:650;letter-spacing:.14em;margin:26px 2px 10px;padding-right:0;line-height:1.3}
.sh-sub{color:var(--muted);margin:0 0 18px;font-size:var(--t-sm);line-height:1.45}
.sh-x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.04)}
.sh-x svg{width:18px;height:18px}

/* formulários */
.fld{display:block;margin:0 0 16px}
.lbl{display:block;font-size:var(--t-sm);font-weight:620;color:var(--ink-2);margin:0 0 7px}
.lbl .opt{font-weight:450;color:var(--faint)}
.input,.ta,select.input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;background:#141210;border:1px solid var(--line2);outline:none;font-size:max(16px,1rem)}
.ta{min-height:88px;resize:vertical;line-height:1.4}
.input:focus,.ta:focus{border-color:rgba(224,140,78,.7);box-shadow:0 0 0 3px rgba(224,140,78,.12)}
input[type=date].input{-webkit-appearance:none;appearance:none;display:block}
.hint{font-size:var(--t-cap);color:var(--faint);margin-top:6px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 15px;border-radius:var(--r-pill);background:#141210;border:1px solid var(--line2);font-size:var(--t-sm);font-weight:520}
.chip.on,.rpe button.on,.seg button.on{color:#1A0B03;font-weight:650;border-color:transparent;
  background:linear-gradient(180deg,#F2A468,#D98A4E 55%,#BC6E36) padding-box;box-shadow:inset 0 1px 0 rgba(255,236,214,.4)}
.rpe{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.rpe button{min-height:44px;border-radius:11px;background:#141210;border:1px solid var(--line2);font-variant-numeric:tabular-nums;font-size:var(--t-sm)}
.rpe-l{font-size:var(--t-sm);color:var(--text);margin-top:8px;min-height:1.4em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:14px;background:#110F0E;border:1px solid var(--dj-quiet-line)}
.seg button{min-height:40px;border-radius:11px;font-size:var(--t-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:15px;font-weight:650;letter-spacing:-.01em}
.btn.block{width:100%}
.btn.primary{color:#140903;border:1px solid transparent;
  background:radial-gradient(90% 70% at 30% 0%,rgba(255,206,150,.45),transparent 70%) padding-box,linear-gradient(180deg,var(--hm-copper-hi),var(--hm-copper) 48%,var(--hm-copper-lo)) padding-box,linear-gradient(170deg,#FFD3A4,rgba(214,128,66,.6) 50%,#7A3610) border-box;
  box-shadow:inset 0 1px 0 rgba(255,236,214,.45),0 8px 18px -10px rgba(214,122,56,.6)}
.btn.primary svg{width:20px;height:20px}
.btn.ghost{background:#171513;border:1px solid var(--line2)}
.btn.plain{color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.btn:active{filter:brightness(.9)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.chk{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--dj-quiet-rule);min-height:48px}
.chk-g + .chk{border-top:0}
.chk .bx{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:1px}
.chk.on .bx{background:linear-gradient(180deg,#F2A468,#C9773C);border-color:transparent;color:#1A0B03}
.chk .bx svg{width:16px;height:16px}
.chk-g{font-size:var(--t-cap);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:650;margin:20px 0 4px}
.ord{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--dj-quiet-rule)}
.ord:first-child{border-top:0}
.ord .n{width:26px;flex:0 0 26px;color:var(--dj-signal);font-size:var(--t-lg);font-weight:700;text-align:center}
.ord .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ord .mv{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--dj-tile);border:1px solid var(--dj-tile-line)}
.ord .mv svg{width:18px;height:18px}
.ord .mv:disabled{opacity:.3}

/* registrar: quatro cartões-joia compactos */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.qgrid .hc{min-height:104px}

/* guia */
.ev{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:var(--t-cap);font-weight:620;padding:3px 10px;border-radius:14px;border:1px solid var(--line2);color:var(--muted);background:rgba(255,255,255,.02)}
.ev i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ev.forte{color:var(--ok)} .ev.moderada{color:#D7B378} .ev.fraca{color:var(--faint)} .ev.consenso{color:var(--dj-signal)} .ev.regra{color:#7EA5E0}
.g-card{padding:16px}
.g-card h3{font-size:var(--t-body);font-weight:680;letter-spacing:-.012em;margin:0 0 8px;line-height:1.3}
.g-card p,.g-card li{color:var(--ink-2);font-size:var(--t-sm);line-height:1.5}
.g-card ul{margin:6px 0 8px;padding-left:18px}
.g-card li{margin:4px 0}
.g-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g-src{font-size:var(--t-cap);color:var(--faint);margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm);margin:6px 0 4px}
.tbl th{text-align:left;font-weight:620;color:var(--muted);padding:6px 6px 6px 0;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px 6px 8px 0;border-bottom:1px solid var(--dj-quiet-rule);vertical-align:top;color:var(--ink-2)}
.tbl td:first-child{white-space:nowrap}
.big-text .tbl td:first-child{white-space:normal}
.big-text .tbl{table-layout:fixed}
.tbl td,.tbl th{overflow-wrap:anywhere}
.tbl tr.me td{color:var(--dj-signal);font-weight:650}
.refs a{display:block;padding:12px 0;border-top:1px solid var(--dj-quiet-rule);text-decoration:none;color:var(--text);font-size:var(--t-sm);font-weight:600}
.refs a:first-child{border-top:0}
.refs a span{display:block;color:var(--faint);font-size:var(--t-cap);font-weight:450;margin-top:2px}

/* fotos e vídeos */
.backlink{display:inline-flex;align-items:center;gap:4px;min-height:40px;margin:2px 0 -6px;color:var(--dj-signal);font-weight:600;font-size:var(--t-body)}
.backlink svg{width:18px;height:18px}
.mth{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(155deg,#221E1B,#141210);border:1px solid var(--dj-tile-line)}
.mth img{display:block;width:100%;height:100%;object-fit:cover}
.mth.gone::after{content:"fora do aparelho";position:absolute;inset:0;display:grid;place-items:center;font-size:var(--t-cap);color:var(--faint);text-align:center;padding:4px}
.mth .mplay{position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mth .mplay svg{width:12px;height:12px;margin-left:1px}
.mth.sm{width:32px;height:32px;border-radius:9px}
.mth.sm .mplay{width:14px;height:14px;left:2px;bottom:2px}
.mth.sm .mplay svg{width:8px;height:8px}
.row .ic:has(.mth){padding:0;overflow:hidden;background:none;border:0}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcell{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left}
.mdate{font-size:var(--t-cap);color:var(--muted)}
.mbest{position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:var(--r-pill);font-size:.7rem;font-weight:700;color:#1A1B04;background:linear-gradient(180deg,#F1F7A0,#CFDB4E)}
.mview{display:block;width:100%;max-height:56vh;object-fit:contain;border-radius:18px;background:#000;border:1px solid var(--dj-tile-line);margin-bottom:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmp-c video,.cmp-c img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#000;border:1px solid var(--dj-tile-line)}
.cmp-l{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:var(--t-cap);font-weight:650;color:var(--dj-signal)}
.cmp-l span{color:var(--muted);font-weight:450}
.rng{width:100%;height:44px;accent-color:var(--dj-signal)}
@media (max-width:360px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--sab) + 18px);transform:translate(-50%,20px);z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;
  background:rgba(38,33,29,.96);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:var(--t-sm);font-weight:560;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 14px 34px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast .undo{color:var(--dj-signal);font-weight:700;padding:6px 2px;min-height:36px}
.ask{margin-top:12px;padding:14px;border-radius:16px;background:#171513;border:1px solid var(--line2);font-size:var(--t-sm)}
.ask-b{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.ask-b .btn{min-height:44px}

/* boas-vindas */
.welcome{min-height:78vh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 4px}
.welcome .mk{width:84px;height:84px;border-radius:19px;overflow:hidden;box-shadow:0 0 0 1px rgba(236,160,98,.25),0 22px 60px -10px rgba(214,122,56,.35)}
.welcome h1{font-size:2rem;font-weight:720;letter-spacing:-.03em;line-height:1.1;margin:14px 0 0}
.welcome h1 span{color:var(--dj-signal)}
.welcome p{color:var(--ink-2)}

/* telas estreitas e texto ampliado */
@media (max-width:380px){:root{--hm-pad:12px;--hm-col:8px;--hm-row:8px;--hm-r:18px}.hc-h{gap:8px}.hc-v b{font-size:1.412rem}}
@media (max-width:360px){.app{padding-left:12px;padding-right:12px}.rpe{grid-template-columns:repeat(6,minmax(0,1fr))}.two{grid-template-columns:1fr}}
.big-text .hgrid,.big-text .qgrid,.big-text .two{grid-template-columns:1fr}
.big-text .rpe{grid-template-columns:repeat(6,minmax(0,1fr))}
.big-text .row{flex-wrap:wrap}
.big-text .row .rv{order:3;width:100%;text-align:left;padding-left:44px}

  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

/* ---------- fotos e vídeos dos golpes ----------
   Ficam num banco separado dos registros (IndexedDB "bricenotennis-midia"): se algo acontecer com a mídia, os registros não são afetados.
   O app guarda uma cópia leve: vídeo de até 5 s em 720p (cerca de 2 MB) e foto com até 1600 px (cerca de 0,3 MB). O original continua no app Fotos.

function spareMedia(){
  const drop = [];

    for (const m of (a.media || [])) { (byKey[m.stroke + "|" + (m.date || "").slice(0, 7) + "|" + m.kind] ||= []).push(m); if (m.best) keep.add(m); }
    for (const k in byKey) { const g = byKey[k].sort((x, y) => (y.best - x.best) || (y.date || "").localeCompare(x.date || "") || (y.at || 0) - (x.at || 0)); keep.add(g[0]); }
    for (const m of (a.media || [])) if (!keep.has(m)) drop.push([a, m]); }
  return drop;
}

  if (document.hidden) { if (!locked) { hiddenAt = Date.now(); bootCover("veil"); } return; }
  if (locked) { if (!lockBusy) unlock(); return; }
  if (Date.now() - hiddenAt >= (c.after || 0) * 60e3) lockShow(); else bootDone();
});
function lockSheet(){
  sheet("Abrir com Face ID", (el, close) => {
    const body = h("div"); el.append(body);
    const AFTER = [[0, "Na hora"], [1, "1 min"], [5, "5 min"]];
    async function paint(step, code){
      const c = lockCfg();
      if (step === "code") return put(body, h("h2", null, "Código de recuperação"),
        h("p", {class: "sh-sub"}, "Abre o app se o Face ID deixar de funcionar. Guarde em um lugar seguro: ele aparece só agora."),
        h("div", {class: "dj-glass pad", style: "font-weight:700;font-size:1.6rem;text-align:center;letter-spacing:.08em;user-select:all;-webkit-user-select:all"}, code),
        h("div", {class: "stack"}, h("button", {class: "btn primary block", type: "button", onclick: once(async () => { const ok = lockSave({on: true, id: paint.id, rec: await recHash(code), after: 0, at: Date.now()}); close(); render(); toast(ok ? "Face ID ativado" : "Não foi possível salvar neste aparelho"); })}, "Guardei o código")));
      if (c) return put(body, h("h2", null, "Abrir com Face ID"), h("p", {class: "sh-sub"}, "Ligado neste aparelho. Ao abrir o app, o iPhone confirma que é você."),
        group("Travar ao sair do app", h("div", {class: "seg", role: "radiogroup"}, AFTER.map(([v, l]) => h("button", {type: "button", role: "radio", class: (c.after || 0) === v ? "on" : "", "aria-checked": String((c.after || 0) === v),
          onclick: () => { c.after = v; lockSave(c); paint(); }}, l)))),
        h("div", {class: "stack"}, h("button", {class: "btn ghost block danger", type: "button", onclick: once(async () => { let ok = false; try { ok = await faceCheck(c.id); } catch (e) {}
          if (!ok) { toast("Não confirmado"); return; } lockSave(null); close(); render(); toast("Face ID desligado"); }, 1500)}, "Desligar")));
      if (!await faceOK()) return put(body, h("h2", null, "Abrir com Face ID"), h("p", {class: "sh-sub"}, "Este aparelho ou navegador não oferece Face ID para apps da web. No iPhone, abra o Briceno Tennis pelo ícone na tela de início."));
      put(body, h("h2", null, "Abrir com Face ID"), h("p", {class: "sh-sub"}, "Ao abrir o app, o iPhone confirma que é você. Se o rosto não for reconhecido, vale o código do iPhone."),
        h("p", {class: "small muted"}, "É uma tranca na entrada do app: os dados continuam só neste aparelho."),
        h("div", {class: "stack"}, h("button", {class: "btn primary block", type: "button", onclick: once(async () => {
          try { paint.id = await faceCreate(); } catch (e) { toast("Face ID não ativado"); return; }
          paint("code", recNew()); }, 1500)}, "Ativar")));
    }
    put(body, h("h2", null, "Abrir com Face ID")); paint();
  });
}

(() => {   // tamanho de texto do iPhone, com limite para o layout não quebrar
  const pr = document.createElement("span"); pr.style.font = "-apple-system-body"; pr.textContent = "a"; document.body.append(pr);
  const px = pr.style.font ? parseFloat(getComputedStyle(pr).fontSize) : 0; pr.remove();
  if (px) document.documentElement.style.fontSize = Math.min(24, Math.max(15, px)) + "px";
  document.documentElement.classList.toggle("big-text", px >= 21);
})();
load();
try { const v = JSON.parse(sessionStorage.getItem(KEY + ".view")); if (v) v.tab = {diario: "hoje", torneios: "carreira", evolucao: "hoje"}[v.tab] || v.tab; if (v && TABS.some(t => t[0] === v.tab)) view.tab = v.tab; } catch (e) {}
if (lockCfg()) lockShow(); else { appShown = true; render(); requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(bootDone, matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 650))); }
