<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Briceno Tennis</title>
<meta name="color-scheme" content="dark light">
<style>
/* ---------- tokens (escuro é o padrão da família Briceno; claro segue o aparelho) ---------- */
:root{
  --bg:#0B0A09; --bg2:#100E0C; --surface:#161311; --surface2:#1E1A17; --raise:#24201C;
  --line:rgba(255,236,218,.09); --line2:rgba(255,236,218,.16);
  --text:#F5EFE8; --muted:#B0A396; --faint:#8A7E73;
  --clay:#E0875A; --clay-2:#C96E42; --clay-ink:#1B0E07; --clay-soft:rgba(224,135,90,.14);
  --gold:#D7B378; --scrim:rgba(0,0,0,.55);
  --b-red:#E8624E; --b-orange:#F29A4C; --b-green:#8FC45A; --b-yellow:#D8DE52;
  --ok:#8FC45A; --danger:#E86A5C;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.35);
  --r-card:18px; --r-sm:12px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --t-cap:.8125rem; --t-sm:.875rem; --t-body:1rem; --t-lg:1.125rem; --t-xl:1.375rem; --t-xxl:1.75rem;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --tabbar:56px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F2ED; --bg2:#EFE9E2; --surface:#FFFFFF; --surface2:#F5F0EA; --raise:#FFFFFF;
    --line:rgba(52,32,14,.10); --line2:rgba(52,32,14,.18);
    --text:#1C1714; --muted:#685C52; --faint:#8C8076;
    --clay:#B95D30; --clay-2:#A24F26; --clay-ink:#FFFFFF; --clay-soft:rgba(185,93,48,.10);
    --gold:#8E6A2E; --scrim:rgba(20,12,6,.35);
    --b-red:#D24A36; --b-orange:#DD7D25; --b-green:#5E9A2C; --b-yellow:#A9AE16;
    --ok:#5E9A2C; --danger:#C2412F;
    --shadow:0 1px 2px rgba(52,32,14,.06), 0 8px 24px rgba(52,32,14,.07);
  }
}
:root[data-theme="dark"]{ color-scheme:dark }
html{font-size:17px;-webkit-text-size-adjust:100%;background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--t-body);line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--clay)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:8px}

/* ---------- abertura ---------- */
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s ease}
#boot.out{opacity:0;pointer-events:none}
#boot.inst{transition:none}
#boot .bt-mark{width:88px;height:88px;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:bt-in .7s cubic-bezier(.2,.8,.2,1) both}
#boot .bt-name{font-family:var(--serif);font-size:1.5rem;letter-spacing:.01em;animation:bt-in .7s .08s cubic-bezier(.2,.8,.2,1) both}
#boot .bt-name span{color:var(--clay)}
#boot .bt-ctl{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:96px}
#boot:not(.lock) .bt-ctl{visibility:hidden}
#boot.busy .bt-ctl{opacity:.5;pointer-events:none}
@keyframes bt-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#boot .bt-mark,#boot .bt-name{animation:none}}
.bt-face{display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:var(--r-pill);background:var(--clay);color:var(--clay-ink);font-weight:600}
.bt-face svg{width:22px;height:22px}
.bt-rec{color:var(--muted);font-size:var(--t-sm);padding:8px}
.bt-msg{color:var(--danger);min-height:1.2em;margin:0;font-size:var(--t-sm)}
.bt-form{display:flex;gap:8px}

/* ---------- estrutura ---------- */
.app{max-width:620px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 8px) 16px calc(var(--tabbar) + var(--sab) + 40px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.who{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 12px 4px 4px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);max-width:100%}
.who .av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:#1a1208;background:var(--ballc,var(--clay))}
.who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who svg{width:16px;height:16px;color:var(--muted);flex:0 0 16px}
.page-h{font-family:var(--serif);font-weight:500;font-size:var(--t-xxl);line-height:1.15;margin:18px 0 4px;letter-spacing:.005em}
.page-sub{color:var(--muted);margin:0 0 18px}
.sec-t{display:flex;align-items:center;gap:10px;margin:28px 2px 10px;font-size:var(--t-cap);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sec-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.card + .card{margin-top:10px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:var(--t-sm)} .cap{font-size:var(--t-cap)}
.serif{font-family:var(--serif)}
p{margin:0 0 8px}

/* linhas tocáveis */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:56px;border-top:1px solid var(--line)}
.list > .row:first-child,.list > :first-child .row{border-top:0}
button.row:active{background:var(--surface2)}
.row .ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--clay)}
.row .ic svg{width:19px;height:19px}
.row .bd{flex:1;min-width:0}
.row .t1{font-weight:600;overflow-wrap:anywhere}
.row .t2{color:var(--muted);font-size:var(--t-sm);overflow-wrap:anywhere}
.row .t3{color:var(--text);font-size:var(--t-sm);margin-top:4px;overflow-wrap:anywhere;opacity:.92}
.row .rv{color:var(--muted);font-size:var(--t-sm);white-space:nowrap;text-align:right;padding-top:2px}
.row .chev{width:16px;height:16px;flex:0 0 16px;color:var(--faint);margin-top:4px}
.empty{padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}

/* bolas */
.ball{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bc);box-shadow:inset 0 -2px 3px rgba(0,0,0,.25),inset 0 1px 2px rgba(255,255,255,.35);vertical-align:-1px;flex:0 0 12px}
.b-red{--bc:var(--b-red)} .b-orange{--bc:var(--b-orange)} .b-green{--bc:var(--b-green)} .b-yellow{--bc:var(--b-yellow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);background:var(--surface2);border:1px solid var(--line);font-size:var(--t-sm);white-space:nowrap}

/* cartão de destaque (foco da semana) */
.focus{position:relative;overflow:hidden;padding:18px;background:linear-gradient(140deg,color-mix(in srgb,var(--clay) 20%,var(--surface)) 0%,var(--surface) 62%);border:1px solid color-mix(in srgb,var(--clay) 35%,var(--line));border-radius:var(--r-card);width:100%;text-align:left;box-shadow:var(--shadow)}
.focus .eb{font-size:var(--t-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--clay);font-weight:600}
.focus .ft{font-family:var(--serif);font-size:var(--t-xl);line-height:1.25;margin-top:6px;overflow-wrap:anywhere}
.focus .fs{color:var(--muted);font-size:var(--t-sm);margin-top:6px}

/* semana */
.wk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk .k{padding:14px 16px;margin:0}
.wk .kv{font-family:var(--serif);font-size:var(--t-xl);line-height:1.2}
.wk .kl{color:var(--muted);font-size:var(--t-sm)}
.ref{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--line);font-size:var(--t-sm);color:var(--muted)}
.ref b{color:var(--text);font-weight:600}
.note{padding:12px 14px;border-radius:var(--r-sm);background:var(--clay-soft);border:1px solid color-mix(in srgb,var(--clay) 25%,transparent);font-size:var(--t-sm)}

/* linha do tempo das bolas */
.tl{padding:6px 16px}
.tl-i{display:flex;gap:14px;position:relative;padding:12px 0}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:8px;top:34px;bottom:-6px;width:2px;background:var(--line2)}
.tl-i .ball{width:18px;height:18px;flex:0 0 18px;margin-top:2px}
.tl-i.off .ball{opacity:.28}
.tl-i .bd{flex:1;min-width:0}
.tl-i .t1{font-weight:600}
.tl-i .t2{color:var(--muted);font-size:var(--t-sm)}
.tl-i.now .t1::after{content:"atual";margin-left:8px;font-size:var(--t-cap);font-weight:600;color:var(--clay);letter-spacing:.06em;text-transform:uppercase}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 72px repeat(2,minmax(0,1fr));height:var(--tabbar);align-items:stretch}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:12px;font-weight:500;position:relative;min-width:0}
.tab svg{width:23px;height:23px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{color:var(--clay)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--clay)}
.tab:active{opacity:.6}
.fab{justify-self:center;align-self:center;width:52px;height:52px;border-radius:50%;margin-top:-18px;display:grid;place-items:center;color:var(--clay-ink);background:radial-gradient(120% 120% at 30% 20%,color-mix(in srgb,var(--clay) 70%,#fff) 0%,var(--clay) 45%,var(--clay-2) 100%);box-shadow:0 0 0 5px var(--bg),0 10px 24px rgba(0,0,0,.35)}
.fab svg{width:26px;height:26px}
.fab:active{filter:brightness(.88)}

/* folhas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-width:620px;margin:0 auto;max-height:calc(100% - var(--sat) - 12px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 18px calc(var(--sab) + 22px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:2px auto 12px}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:var(--t-xl);margin:4px 0 4px;line-height:1.2}
.sh-sub{color:var(--muted);margin:0 0 16px;font-size:var(--t-sm)}
.sh-x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.sh-x svg{width:20px;height:20px}

/* formulários */
.fld{display:block;margin:0 0 14px}
.lbl{display:block;font-size:var(--t-sm);font-weight:600;color:var(--muted);margin:0 0 6px}
.lbl .opt{font-weight:400;color:var(--faint)}
.input,.ta,select.input{width:100%;min-height:48px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line2);outline:none;font-size:max(16px,1rem)}
.ta{min-height:88px;resize:vertical;line-height:1.4}
.input:focus,.ta:focus{border-color:var(--clay)}
input[type=date].input,input[type=month].input{-webkit-appearance:none;appearance:none;display:block}
.hint{font-size:var(--t-cap);color:var(--faint);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line2);font-size:var(--t-sm)}
.chip.on{background:var(--clay);border-color:var(--clay);color:var(--clay-ink);font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.rpe button{min-height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line2);font-variant-numeric:tabular-nums;font-size:var(--t-sm)}
.rpe button.on{background:var(--clay);border-color:var(--clay);color:var(--clay-ink);font-weight:700}
.rpe-l{font-size:var(--t-sm);color:var(--text);margin-top:8px;min-height:1.4em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:10px;font-size:var(--t-sm);padding:0 6px}
.seg button.on{background:var(--clay);color:var(--clay-ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:600}
.btn.block{width:100%}
.btn.primary{background:var(--clay);color:var(--clay-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line2)}
.btn.plain{color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.btn:active{filter:brightness(.9)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.chk{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:48px}
.chk:first-of-type{border-top:0}
.chk .bx{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:1px}
.chk.on .bx{background:var(--clay);border-color:var(--clay);color:var(--clay-ink)}
.chk .bx svg{width:16px;height:16px}
.chk-g{font-size:var(--t-cap);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:18px 0 2px}
.ord{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:0}
.ord .n{width:26px;flex:0 0 26px;font-family:var(--serif);color:var(--clay);font-size:var(--t-lg);text-align:center}
.ord .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ord .mv{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.ord .mv svg{width:18px;height:18px}
.ord .mv:disabled{opacity:.3}

/* registrar */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.qbig{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;min-height:104px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);text-align:left}
.qbig svg{width:26px;height:26px;color:var(--clay)}
.qbig b{font-weight:600}
.qbig span{font-size:var(--t-cap);color:var(--muted)}

/* guia */
.ev{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-cap);font-weight:600;padding:3px 9px;border-radius:var(--r-pill);border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.ev i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ev.forte{color:var(--ok)} .ev.moderada{color:var(--gold)} .ev.fraca{color:var(--faint)} .ev.consenso{color:var(--clay)} .ev.regra{color:var(--text)}
.g-card{padding:16px}
.g-card h3{font-family:var(--serif);font-weight:500;font-size:var(--t-lg);margin:0 0 8px;line-height:1.25}
.g-card ul{margin:6px 0 8px;padding-left:20px}
.g-card li{margin:4px 0}
.g-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g-src{font-size:var(--t-cap);color:var(--faint);margin-top:8px}
.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm);margin:6px 0 4px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);padding:6px 6px 6px 0;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.me td{color:var(--clay);font-weight:600}
.tbl td:first-child{white-space:nowrap}
.refs a{display:block;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.refs a:first-child{border-top:0}
.refs a span{display:block;color:var(--faint);font-size:var(--t-cap)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + var(--sab) + 18px);transform:translate(-50%,20px);z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-size:var(--t-sm);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto}
#toast.top{bottom:auto;top:calc(var(--sat) + 12px);transform:translate(-50%,-20px)}
#toast.top.on{transform:translate(-50%,0)}
#toast .undo{color:var(--clay-2);font-weight:700;padding:6px 2px;min-height:36px}
.ask{margin-top:12px;padding:14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line2)}
.ask-b{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.ask-b .btn{min-height:44px}

/* boas-vindas */
.welcome{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:20px 4px}
.welcome .mk{width:72px;height:72px;border-radius:18px;overflow:hidden}
.welcome h1{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.15;margin:8px 0 0}
.welcome p{color:var(--muted)}

/* telas estreitas e texto ampliado */
@media (max-width:360px){
  .app{padding-left:12px;padding-right:12px}
  .tab{font-size:11px}
  .rpe{grid-template-columns:repeat(6,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
}
.big-text .wk,.big-text .qgrid,.big-text .two{grid-template-columns:1fr}
.big-text .rpe{grid-template-columns:repeat(6,minmax(0,1fr))}
.big-text .row{flex-wrap:wrap}
.big-text .row .rv{order:3;width:100%;text-align:left;padding-left:46px}
</style>
</head>
<body>

/* ---------- datas ---------- */
const pad2 = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const today = () => iso(new Date());
const parseD = s => { if (!s) return null; const [y, m, d] = String(s).split("-").map(Number); return y ? new Date(y, (m || 1) - 1, d || 1) : null; };
const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const MESX = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const fmtD = s => { const d = parseD(s); return d ? d.getDate() + " " + MES[d.getMonth()] + " " + d.getFullYear() : ""; };
const fmtDs = s => { const d = parseD(s); if (!d) return ""; return d.getDate() + " " + MES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""); };
const fmtMY = s => { const d = parseD(s); return d ? MES[d.getMonth()] + " " + d.getFullYear() : ""; };
function ageAt(birth, at){ const b = parseD(birth), d = at ? parseD(at) : new Date(); if (!b || !d) return null;
  let a = d.getFullYear() - b.getFullYear(); if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) a--; return a; }
function monthsBetween(a, b){ const x = parseD(a), y = b ? parseD(b) : new Date(); if (!x || !y) return null;
  let m = (y.getFullYear() - x.getFullYear()) * 12 + (y.getMonth() - x.getMonth()); if (y.getDate() < x.getDate()) m--; return Math.max(0, m); }
function dur(m){ if (m == null) return ""; if (m < 1) return "menos de 1 mês"; const y = Math.floor(m / 12), r = m % 12;
  return [y ? y + (y > 1 ? " anos" : " ano") : "", r ? r + (r > 1 ? " meses" : " mês") : ""].filter(Boolean).join(" e "); }
function addYears(s, n){ const d = parseD(s); if (!d) return null; return iso(new Date(d.getFullYear() + n, d.getMonth(), d.getDate())); }
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
const hm = min => { min = Math.round(min || 0); const hh = Math.floor(min / 60), mm = min % 60; return hh ? hh + " h" + (mm ? " " + pad2(mm) : "") : mm + " min"; };

  {k: "orange", n: "Laranja", age: "8 a 10 anos (ideal mudar aos 8 ou 9)", racket: "23\" a 25\"", speed: "50% mais lenta", court: "18 m × 6,5–8,23 m, rede de 80–91 cm"},

const COMP = [

/* ---------- dados salvos neste aparelho ---------- */
// A chave não muda depois de publicada. Migrações nunca apagam dados: guardam uma cópia antes.
const KEY = "bricenotennis.v1", VERSION = 1;
let S;
const blank = () => ({app: "briceno-tennis", version: VERSION, athletes: [], activeId: null, meta: {lastBackup: null}});
function normAthlete(a){
  a.balls = a.balls || {}; a.comp = a.comp || {}; a.rackets = a.rackets || []; a.strings = a.strings || [];
  a.prefs = a.prefs || []; a.prio = a.prio || []; a.entries = a.entries || []; a.tours = a.tours || [];
  return a;
}
function load(){
  let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) {}
  try { S = raw ? JSON.parse(raw) : null; } catch (e) { S = null; }
  if (!S || typeof S !== "object") { S = blank(); return; }
  if ((S.version || 1) < VERSION) { try { if (!localStorage.getItem(KEY + ".antes-da-v" + VERSION)) localStorage.setItem(KEY + ".antes-da-v" + VERSION, raw); } catch (e) {} S.version = VERSION; }
  S.athletes = (S.athletes || []).filter(a => a && typeof a === "object").map(normAthlete);
  S.meta = S.meta || {lastBackup: null};
  if (!S.athletes.some(a => a.id === S.activeId)) S.activeId = S.athletes[0] ? S.athletes[0].id : null;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { toast("Não foi possível salvar neste aparelho"); return false; }
}
const active = () => S.athletes.find(a => a.id === S.activeId) || null;
const fem = a => !a || a.sex !== "m";
const gx = (a, f, m) => fem(a) ? f : m;
const resLabel = (a, k) => { const r = RESULTS.find(x => x[0] === k); return r ? (r[2] && !fem(a) ? r[2] : r[1]) : ""; };
function curBall(a){ let c = null; for (const b of BALLS) if (a.balls[b.k]) c = b.k; return c; }
function nextBall(a){ const c = curBall(a); const i = BALLS.findIndex(b => b.k === c); return i >= 0 && i < BALLS.length - 1 ? BALLS[i + 1].k : (c ? null : "red"); }
const curRacket = a => a.rackets.filter(r => !r.to).sort((x, y) => (y.from || "").localeCompare(x.from || ""))[0] || null;
const curString = a => a.strings.slice().sort((x, y) => (y.date || "").localeCompare(x.date || ""))[0] || null;

// snapshot para Desfazer
const snap = () => JSON.stringify(S);
function undoTo(s){ S = JSON.parse(s); S.athletes.forEach(normAthlete); save(); render(); }

/* ---------- toast, folhas e confirmação ---------- */
function toast(msg, undo){
  const t = $("#toast"), off = () => t.classList.remove("on", "act");
  put(t, h("span", null, msg), undo ? h("button", {type: "button", class: "undo", onclick: () => { clearTimeout(toast.t); off(); undo(); }}, "Desfazer") : null);
  t.classList.toggle("act", !!undo); t.classList.toggle("top", !!document.querySelector(".sheet.on")); t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(off, undo ? 6000 : 1800);
}
function sheet(label, build){
  const scrim = h("div", {class: "scrim"});
  const el = h("div", {class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": label}, h("div", {class: "grab"}));
  let closed = false;
  function close(){ if (closed) return; closed = true; el.classList.remove("on"); scrim.classList.remove("on"); setTimeout(() => { el.remove(); scrim.remove(); }, 280); }
  const add0 = el.append.bind(el); el.append = (...k) => add0(...k.flat(Infinity).filter(x => x != null && x !== false));
  { const t = $("#toast"); clearTimeout(toast.t); t.classList.remove("on", "act"); }   // ao abrir outra folha, o aviso anterior sai
  scrim.addEventListener("click", close);
  el.append(h("button", {class: "sh-x", type: "button", "aria-label": "Fechar", onclick: close}, svg("x")));
  build(el, close);
  document.body.append(scrim, el);

  return {el, close};
}
function ask(slot, text, label, fn){
  const close = () => slot.replaceChildren();
  slot.replaceChildren(h("div", {class: "ask", role: "alertdialog"}, h("div", null, text),
    h("div", {class: "ask-b"}, h("button", {class: "btn ghost", type: "button", onclick: close}, "Cancelar"),
      h("button", {class: "btn ghost danger", type: "button", onclick: () => { close(); fn(); }}, label))));

}

const numOrNull = s => { const n = parseFloat(String(s).replace(",", ".")); return isFinite(n) && n >= 0 ? n : null; };

/* ---------- navegação ---------- */
const TABS = [["diario", "Diário", "diary"], ["evolucao", "Evolução", "growth"], ["carreira", "Carreira", "flag"], ["guia", "Guia", "book"]];

function backupText(){ return JSON.stringify({app: "briceno-tennis", version: VERSION, exportedAt: new Date().toISOString(), data: S}, null, 1); }
async function doBackup(){
  const name = "briceno-tennis-backup-" + today() + ".json", text = backupText();
  let ok = false;
  try {
    const file = new File([text], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "Backup do Briceno Tennis"}); ok = true; }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  if (!ok) { const url = URL.createObjectURL(new Blob([text], {type: "application/json"})), link = h("a", {href: url, download: name}); document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); ok = true; }
  if (ok) { S.meta.lastBackup = today(); save(); }
  return ok;
}

function restoreSheet(){

    const file = h("input", {type: "file", accept: "application/json,.json", hidden: true});

      const f = file.files && file.files[0]; if (!f) return;
      let d; try { d = JSON.parse(await f.text()); } catch (e) { status.textContent = "Este arquivo não é um backup válido."; return; }
      const data = d && d.app === "briceno-tennis" && d.data && Array.isArray(d.data.athletes) ? d.data : null;
      if (!data) { status.textContent = "Este arquivo não é um backup do Briceno Tennis."; return; }
      const n = data.athletes.length;
      ask(slot, "Restaurar o backup de " + (d.exportedAt ? fmtD(d.exportedAt.slice(0, 10)) : "data desconhecida") + " com " + n + (n === 1 ? " atleta" : " atletas") + "? Os dados atuais deste aparelho serão substituídos.", "Restaurar", () => {
        const before = snap(); S = data; S.athletes = S.athletes.filter(x => x && typeof x === "object").map(normAthlete); S.meta = S.meta || {lastBackup: null};
        if (!S.athletes.some(x => x.id === S.activeId)) S.activeId = S.athletes[0] ? S.athletes[0].id : null;
        if (!save()) return; close(); render(); toast("Backup restaurado", () => undoTo(before));
      });
    });
    el.append(h("h2", null, "Restaurar backup"), h("p", {class: "sh-sub"}, "Escolha o arquivo .json salvo antes. Antes de substituir, o app pede confirmação, e dá para desfazer."),
      h("div", {class: "stack"}, h("button", {type: "button", class: "btn primary block", onclick: () => file.click()}, "Escolher arquivo")), file, status, slot);
  });

/* Face ID opcional (mesmo padrão do Briceno Life): passkey deste aparelho com verificação do usuário.
   É uma tranca na entrada do app, não criptografia. A configuração fica numa chave à parte e não vai no backup. */
const LOCK_KEY = KEY + ".lock";
const lockCfg = () => { try { const c = JSON.parse(localStorage.getItem(LOCK_KEY)); return c && c.on && c.id && c.rec ? c : null; } catch (e) { return null; } };
const lockSave = c => { try { if (c) localStorage.setItem(LOCK_KEY, JSON.stringify(c)); else localStorage.removeItem(LOCK_KEY); return true; } catch (e) { return false; } };
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const recNorm = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const recHash = async s => b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("briceno-tennis:" + recNorm(s))));
function recNew(){ const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", r = rnd(8); let c = ""; for (let i = 0; i < 8; i++) c += A[r[i] % A.length]; return c.slice(0, 4) + "-" + c.slice(4); }
async function faceOK(){ try { return !!(window.PublicKeyCredential && window.isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } }
async function faceCreate(){
  const cred = await navigator.credentials.create({publicKey: {challenge: rnd(32), rp: {name: "Briceno Tennis"}, user: {id: rnd(16), name: "Briceno Tennis", displayName: "Briceno Tennis"},
    pubKeyCredParams: [{type: "public-key", alg: -7}, {type: "public-key", alg: -257}], timeout: 60000, attestation: "none",
    authenticatorSelection: {authenticatorAttachment: "platform", userVerification: "required", residentKey: "preferred"}}});
  return b64u(cred.rawId);
}
async function faceCheck(id){
  const ch = rnd(32);
  const r = await navigator.credentials.get({publicKey: {challenge: ch, allowCredentials: [{type: "public-key", id: unb64u(id)}], userVerification: "required", timeout: 60000}});
  const cd = JSON.parse(new TextDecoder().decode(r.response.clientDataJSON)), ad = new Uint8Array(r.response.authenticatorData);
  return cd.type === "webauthn.get" && cd.challenge === b64u(ch) && ad.length > 32 && (ad[32] & 4) === 4 && b64u(r.rawId) === id;
}
const boot = $("#boot"), bootCtl = boot.querySelector(".bt-ctl");
let locked = false, lockBusy = false, hiddenAt = 0, appShown = false;
function bootDone(){ if (locked) return; boot.classList.remove("lock", "busy"); boot.classList.add("out"); boot.setAttribute("aria-hidden", "true"); boot.removeAttribute("role"); }
function bootCover(cls){ boot.classList.add("inst", cls); boot.classList.remove("out"); requestAnimationFrame(() => requestAnimationFrame(() => boot.classList.remove("inst"))); }
function paintLock(mode){
  boot.classList.toggle("busy", mode === "busy");
  if (mode === "busy") return;
  const msg = h("p", {class: "bt-msg", role: "alert"});
  if (mode === "rec") {
    const code = h("input", {class: "input", placeholder: "XXXX-XXXX", autocomplete: "off", autocapitalize: "characters", spellcheck: "false", "aria-label": "Código de recuperação", style: "width:160px"});
    const goRec = async () => { const c = lockCfg(); if (c && recNorm(code.value).length === 8 && await recHash(code.value) === c.rec) { code.blur(); lockOff(); } else msg.textContent = "Código não confere."; };
    code.addEventListener("keydown", e => { if (e.key === "Enter") goRec(); });
    put(bootCtl, h("div", {class: "bt-form"}, code, h("button", {class: "btn primary", type: "button", onclick: goRec}, "Entrar")), msg, h("button", {class: "bt-rec", type: "button", onclick: () => paintLock("idle")}, "Voltar ao Face ID"));
    setTimeout(() => code.focus(), 50); return;
  }
  put(bootCtl, h("button", {class: "bt-face", type: "button", onclick: () => unlock()}, svg("faceid"), "Desbloquear"), h("button", {class: "bt-rec", type: "button", onclick: () => paintLock("rec")}, "Usar código de recuperação"));
}
function lockShow(){ locked = true; bootCover("lock"); boot.setAttribute("aria-hidden", "false"); boot.setAttribute("role", "dialog"); boot.setAttribute("aria-label", "Briceno Tennis bloqueado"); paintLock("idle"); unlock(); }
async function unlock(){
  const c = lockCfg(); if (!c) { lockOff(); return; }
  if (lockBusy) return; lockBusy = true; paintLock("busy");
  let ok = false; try { ok = await faceCheck(c.id); } catch (e) {}
  lockBusy = false;
  if (ok) lockOff(); else if (locked) paintLock("idle");
}
function lockOff(){ locked = false; if (!appShown) { appShown = true; render(); } bootDone(); }
document.addEventListener("visibilitychange", () => {
  const c = lockCfg(); if (!c) return;
  if (document.hidden) { if (!locked) { hiddenAt = Date.now(); bootCover("veil"); } return; }
  if (locked) { if (!lockBusy) unlock(); return; }
  if (Date.now() - hiddenAt >= (c.after || 0) * 60e3) lockShow(); else bootDone();
});
function lockSheet(){
  sheet("Abrir com Face ID", (el, close) => {
    const body = h("div"); el.append(body);
    const AFTER = [[0, "Na hora"], [1, "1 min"], [5, "5 min"]];
    async function paint(step, code){
      const c = lockCfg();
      if (step === "code") return put(body, h("h2", null, "Código de recuperação"),
        h("p", {class: "sh-sub"}, "Abre o app se o Face ID deixar de funcionar. Guarde em um lugar seguro: ele aparece só agora."),
        h("div", {class: "card pad serif", style: "font-size:1.6rem;text-align:center;letter-spacing:.08em;user-select:all;-webkit-user-select:all"}, code),
        h("div", {class: "stack"}, h("button", {class: "btn primary block", type: "button", onclick: once(async () => { const ok = lockSave({on: true, id: paint.id, rec: await recHash(code), after: 0, at: Date.now()}); close(); render(); toast(ok ? "Face ID ativado" : "Não foi possível salvar neste aparelho"); })}, "Guardei o código")));
      if (c) return put(body, h("h2", null, "Abrir com Face ID"), h("p", {class: "sh-sub"}, "Ligado neste aparelho. Ao abrir o app, o iPhone confirma que é você."),
        group("Travar ao sair do app", h("div", {class: "seg", role: "radiogroup"}, AFTER.map(([v, l]) => h("button", {type: "button", role: "radio", class: (c.after || 0) === v ? "on" : "", "aria-checked": String((c.after || 0) === v),
          onclick: () => { c.after = v; lockSave(c); paint(); }}, l)))),
        h("div", {class: "stack"}, h("button", {class: "btn ghost block danger", type: "button", onclick: once(async () => { let ok = false; try { ok = await faceCheck(c.id); } catch (e) {}
          if (!ok) { toast("Não confirmado"); return; } lockSave(null); close(); render(); toast("Face ID desligado"); }, 1500)}, "Desligar")));
      if (!await faceOK()) return put(body, h("h2", null, "Abrir com Face ID"), h("p", {class: "sh-sub"}, "Este aparelho ou navegador não oferece Face ID para apps da web. No iPhone, abra o Briceno Tennis pelo ícone na tela de início."));
      put(body, h("h2", null, "Abrir com Face ID"), h("p", {class: "sh-sub"}, "Ao abrir o app, o iPhone confirma que é você. Se o rosto não for reconhecido, vale o código do iPhone."),
        h("p", {class: "small muted"}, "É uma tranca na entrada do app: os dados continuam só neste aparelho."),
        h("div", {class: "stack"}, h("button", {class: "btn primary block", type: "button", onclick: once(async () => {
          try { paint.id = await faceCreate(); } catch (e) { toast("Face ID não ativado"); return; }
          paint("code", recNew()); }, 1500)}, "Ativar")));
    }
    put(body, h("h2", null, "Abrir com Face ID")); paint();
  });
}
